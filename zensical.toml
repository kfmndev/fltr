[project]
site_name = "fltr"
site_description = "Lightweight HTTP reverse proxy for content-based request filtering and routing"
site_url = "https://kfmndev.github.io/fltr/"
repo_url = "https://github.com/kfmndev/fltr"
repo_name = "kfmndev/fltr"
docs_dir = "docs/public"
nav = [
  { "Overview" = "index.md" },
  { "Guide" = [
    { "Getting started" = "guide/getting-started.md" },
    { "Docker" = "guide/docker.md" },
    { "Troubleshooting" = "guide/troubleshooting.md" },
    { "FAQ" = "guide/faq.md" },
  ] },
  { "Reference" = [
    { "How it works" = "reference/how-it-works.md" },
    { "Environment variables" = "reference/environment-variables.md" },
    { "Block Rules" = "reference/block-rules.md" },
    { "HTTP behavior" = "reference/http-behavior.md" },
    { "Glossary" = "reference/glossary.md" },
  ] },
  { "Internals" = [
    { "Development" = "internals/development.md" },
  ] },
]
edit_uri = "edit/main/docs/public/"
copyright = "&copy; 2026 kfmndev"
extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
font.text = "Inter"
font.code = "JetBrains Mono"
language = "en"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.action.edit",
  "content.code.copy",
]

[project.theme.icon]
edit = "material/pencil"

[[project.theme.palette]]
scheme = "slate"
primary = "blue"
accent = "deep orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
media = "(prefers-color-scheme: dark)"

[[project.theme.palette]]
scheme = "default"
primary = "blue"
accent = "deep orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"
media = "(prefers-color-scheme: light)"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.quotes]
callouts = true
