{% if config.theme.logo %}
  <img class="logo--dark" src="{{ config.theme.logo | url }}" alt="{{ config.site_name }}">
  <img class="logo--light" src="{{ 'assets/logo-light.svg' | url }}" alt="{{ config.site_name }}">
{% else %}
  {% set icon = config.theme.icon.logo or "material/library" %}
  {% include ".icons/" ~ icon ~ ".svg" %}
{% endif %}
