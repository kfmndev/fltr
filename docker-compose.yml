services:
  fltr:
    image: ghcr.io/kfmndev/fltr
    container_name: fltr
    ports:
      - ${FLTR_HTTP_PORT}:8080
    environment:
      - FLTR_ALLOW_UPSTREAM=${FLTR_ALLOW_UPSTREAM}
      - FLTR_BLOCK_UPSTREAM=${FLTR_BLOCK_UPSTREAM}
      - FLTR_BLOCKED_FILE=${FLTR_BLOCKED_FILE}
      - FLTR_CASE_SENSITIVE=${FLTR_CASE_SENSITIVE}
      - FLTR_MAX_BODY_SIZE=${FLTR_MAX_BODY_SIZE}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${FLTR_RULES_FILE}:/config/block_rules.json:ro
    restart: unless-stopped
